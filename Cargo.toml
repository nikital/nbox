[package]
name = "nbox"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "nbox"
path = "src/bin/nbox.rs"

[[bin]]
name = "manage-nbox"
path = "src/bin/manage_nbox.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
eyre = "0.6.12"
ignore = "0.4"
libc = "0.2.186"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[dev-dependencies]
tempfile = "3"
